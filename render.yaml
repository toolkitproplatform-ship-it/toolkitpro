# ====================================================
# Render.com Blueprint Configuration
# Toolkit Pro - Complete Configuration
# ====================================================

services:
  # ====================================================
  # Main Web Service
  # ====================================================
  - type: web
    name: toolkit-pro
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    
    envVars:
      # ---- Server ----
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      
      # ---- Database ----
      - key: DATABASE_URL
        fromDatabase:
          name: toolkit-pro-db
          property: connectionString
      
      # ---- Security ----
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      
      # ---- AdSense ----
      - key: ADSENSE_ENABLED
        value: "true"
      - key: ADSENSE_AUTO_ADS
        value: "true"
      
      # ---- CORS ----
      - key: CORS_ORIGIN
        value: "*"
      
      # ---- Rate Limiting ----
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

# ====================================================
# PostgreSQL Database
# ====================================================
databases:
  - name: toolkit-pro-db
    plan: free
    databaseName: toolkit_pro
    user: toolkit_admin
    ipAllowList: []
